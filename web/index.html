    <meta name="theme-color" content="#000000" id="theme-color" />
    <meta name="darkreader-lock" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      (function() {
        var pref = localStorage.getItem('fas:theme') || 'system';
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.dataset.theme = 'dark';
        var text = localStorage.getItem('stores-text-size');
        if (text === 'lg' || text === 'sm') document.documentElement.dataset.text = text;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <meta name="mobile-web-app-capable" content="yes" />
